spring:
  application:
    name: customer-management

  datasource:
    # In-memory H2. DB_CLOSE_DELAY keeps the database alive between connections
    # so the schema survives an idle pool; data is still lost on shutdown, which
    # is the point of the brief.
    url: jdbc:h2:mem:customers;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      # Acceptable because the database is ephemeral by design. A durable
      # database would use Flyway migrations with ddl-auto=validate; see README.
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.nandinirai.customers: INFO
